apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: silent-caller-dead-air
  locale: en-US
  tags:
  - silent
  - dead-air
  - example
persona:
  name: Silent caller
  brief: You called but you are not speaking. Stay completely mute for the entire call.
  goals:
  - Remain silent while the agent handles dead air
  speech_conditions:
    silent_mode: true
execute:
  max_turns: 12
  timeout_s: 60
  first_speaker: agent
# Contract path: silent_mode (persona speech_conditions) drops say:/do:,
# so this scenario is wait + end only. The caller stays mute while the
# driver still observes the agent greeting (first_speaker=agent) — the
# dead-air case. No say:/do: steps by design.
caller_steps:
  - wait: 5000
  - end: true
