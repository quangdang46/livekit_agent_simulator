apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: interrupt-rate-medium
  locale: en-US
  tags:
  - interruption
  - stress
  - example
persona:
  name: Impatient caller
  brief: You ask one simple question but keep cutting the assistant off mid-sentence.
  goals:
  - Hear the agent greeting
  - Ask one short request (hours or pricing)
  - Let the agent finish after your interruptions
  - End politely
  traits:
  - impatient
  speech_conditions:
    interruption_rate: medium
    interruption_interval_ms: 12000
    interruption_say: Sorry — quick question —
execute:
  max_turns: 10
  timeout_s: 120
  first_speaker: agent
# Contract path (caller_contract single path): these steps drive
# ContractCallerDriver instead of the legacy persona free-generation bridge.
# Persona/assert/execute blocks below unchanged.
# Seeded interruption policy (contract equivalent of the legacy
# InterruptRateRunner, deterministic per agent-turn instead of wall-clock):
# while the ask behavior runs, the driver may emit a fixed "Mhm." cut-in
# when the agent is speaking. The explicit interrupt: below stays as the
# authored cut-in. speech_conditions: above unchanged (legacy bridge).
caller_steps:
  - say: "Hi, what are your hours?"
  - do:
      behavior: ask
      target: hours
      constraints:
        max_turns: 4
      interaction:
        interruption_rate: medium
        interruption_interval_ms: 12000
        interruption_seed: 7
  - interrupt: true
  - say: "Sorry — quick question — what are your hours?"
  - say: "Thanks, bye."
  - end: true
assert:
  outcomes:
  - id: recovers
    type: recovery
    role: any
    min_agent_finals_after_barge_in: 1
    min_interruptions: 0
    require_turn_samples: 0
    min_goals: 1
    check_agent_transcript: false
