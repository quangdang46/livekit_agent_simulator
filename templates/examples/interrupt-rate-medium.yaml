apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: interrupt-rate-medium
  locale: en-US
  tags:
  - interruption
  - stress
  - example
persona:
  name: Impatient caller
  brief: You ask one simple question but keep cutting the assistant off mid-sentence.
  goals:
  - Hear the agent greeting
  - Ask one short request (hours or pricing)
  - Let the agent finish after your interruptions
  - End politely
  traits:
  - impatient
execute:
  max_turns: 10
  timeout_s: 120
  first_speaker: agent
# Contract path (caller_contract single path): these steps drive
# ContractCallerDriver instead of the legacy persona free-generation bridge.
# Persona/assert/execute blocks below unchanged.
#
# No persona speech_conditions: block — the legacy interruption keys are
# gone from this template (removal-gate condition "no template authoring
# legacy keys"). The rate policy is authored entirely on the do: step
# below, which is what the persona bridge used to fill in: the driver
# would have derived exactly this seed from the scenario id
# (_seed_from_id("interrupt-rate-medium") == 910336205) and applied the
# same rate/interval, so removing the persona block is behavior-preserving.
# The explicit interrupt: below stays as the authored cut-in.
caller_steps:
  - say: "Hi, what are your hours?"
  - do:
      behavior: ask
      target: hours
      constraints:
        max_turns: 4
      interaction:
        interruption_rate: medium
        interruption_interval_ms: 12000
        interruption_seed: 910336205
  - interrupt: true
  - say: "Sorry — quick question — what are your hours?"
  - say: "Thanks, bye."
  - end: true
assert:
  outcomes:
  - id: recovers
    type: recovery
    role: any
    min_agent_finals_after_barge_in: 1
    min_interruptions: 0
    require_turn_samples: 0
    min_goals: 1
    check_agent_transcript: false
