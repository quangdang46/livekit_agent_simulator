apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: accent-english-skeptical
  locale: en-US
  tags: [draft, accent]
persona:
  name: Marcus
  brief: |
    Calling about a service quote. English is your first language but you are
    skeptical and want concrete next steps, not vague assurances.
  goals:
  - Get a firm quote in writing
  - Confirm there are no hidden fees
  style: direct, skeptical
  traits:
  - skeptical
  - urgent
  speech_conditions:
    verbosity: chatty
execute:
  max_turns: 5
  timeout_s: 90
  first_speaker: user
# Contract path (caller_contract single path): these steps drive
# ContractCallerDriver instead of the legacy persona free-generation bridge.
# Persona/assert/execute blocks below unchanged.
caller_steps:
  - say: "Hi, I need a firm quote in writing for the service."
  - do:
      behavior: ask
      target: price
      constraints:
        max_turns: 3
  - do:
      behavior: ask
      target: fees
      constraints:
        max_turns: 2
  - say: "Thanks, bye."
  - end: true
pass_criteria:
  criteria:
  - The agent gave a concrete quote or timeline
  - The agent addressed the hidden-fee concern
