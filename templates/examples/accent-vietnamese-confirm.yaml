apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: accent-vietnamese-confirm
  locale: vi-VN
  tags: [draft, accent, smoke]
persona:
  name: Anh
  brief: |
    Bạn gọi để xác nhận đơn hàng đã đặt. Nói tiếng Việt, giao tiếp tự nhiên
    nhưng hơi dè dặt. (Calling to confirm an order. Speak Vietnamese naturally
    but somewhat reserved.)
  goals:
  - Xác nhận đơn hàng đã đặt
  - Hỏi thời gian giao hàng dự kiến
  style: polite, natural spoken language
  traits:
  - polite
  - non_native
  speech_conditions:
    verbosity: natural
execute:
  max_turns: 4
  timeout_s: 90
  first_speaker: user
# Contract path (caller_contract single path): these steps drive
# ContractCallerDriver instead of the legacy persona free-generation bridge.
# Persona/assert/execute blocks below unchanged.
caller_steps:
  - say: "Chào bạn, mình muốn xác nhận đơn hàng đã đặt."
  - do:
      behavior: ask
      target: delivery_date
      constraints:
        max_turns: 3
  - say: "Cảm ơn bạn nhé, chào bạn."
  - end: true
pass_criteria:
  criteria:
  - The agent responded in Vietnamese
  - The agent confirmed the order or asked a clarifying question
