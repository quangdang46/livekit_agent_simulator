apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: quiet-caller-confirm
  locale: en-US
  tags:
  - quiet
  - audio-quality
  - example
persona:
  name: Quiet caller
  brief: You are calling from a soft-spoken line. Speak your goals clearly but the mic is quiet.
  goals:
  - Hear the agent greeting
  - State one short request (hours or pricing)
  - Confirm any important field if the agent asks you to repeat
  - End politely
  traits:
  - polite
  speech_conditions:
    voice_gain: 0.3
execute:
  max_turns: 8
  timeout_s: 90
  first_speaker: agent

# Contract path (caller_contract single path): these steps drive
# ContractCallerDriver instead of the legacy persona free-generation bridge.
# Persona/assert/execute blocks below unchanged.
caller_steps:
  - say: "Hi, what are your hours?"
  - do:
      behavior: ask
      target: hours
      constraints:
        max_turns: 3
  - say: "Thanks, bye."
  - end: true
assert:
  outcomes:
  - id: agent_spoke
    type: transcript_contains
    role: agent
    phrases: [hello, press, keypad, welcome]
