apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: inbound-caller-sim
  locale: en-US
  tags:
  - telephony
  - inbound
persona:
  name: Jordan
  brief: You are calling support about a recent charge on your account. Be polite and concise.
  goals:
  - Explain the billing question
  - Get a clear next step
  style: polite, short sentences
execute:
  max_turns: 10
  timeout_s: 120
  first_speaker: user
caller:
  mode: inbound_sip
telephony:
  dial_in: '+15551234567'
assert:
  transcript:
  - role: agent
    contains_any:
    - a
    - e
    - i
    - o
    - u
  sip:
    participant_present: true
    call_status_any:
    - active
    dial_answered: true
# Contract path (caller_contract single path): caller_steps drive
# ContractCallerDriver; persona/caller/telepathy blocks below unchanged.
caller_steps:
  - say: "Hi, I have a billing question about a recent charge."
  - do:
      behavior: ask
      target: charge
      constraints:
        max_turns: 3
  - say: "Thanks, bye."
  - end: true
pass_criteria:
  criteria:
  - The agent responded to the inbound caller
  - The agent could be understood

# NOTE: the optional response-router `responses:` catalog is documented
# COMMENTED OUT in templates/smoke-hello.yaml rather than active here, for
# the same reason: a catalog with no `router:` block in config raises
# ConfigError at run time. Show, do not enable.
# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL — the response-router catalog. SHOWN, NOT ENABLED.
#
# Uncommenting this block alone WILL NOT WORK, and that is deliberate: a
# scenario carrying `responses:` with no `router:` block in
# `.agent-sim/config.yaml` raises a ConfigError naming this scenario. The
# failure is loud on purpose — silently falling back to `caller_steps` would
# make a routed scenario look exactly like a legacy one while ignoring every
# response you authored.
#
# To turn it on you must ALSO uncomment `router:` (and `text_planner:`) in
# `.agent-sim/config.yaml`. Both blocks ship commented-out there for the same
# reason: `lks init` scaffolds a project for someone who has not asked for a
# router, and a shipped-but-dead api_key placeholder is the "knob nobody runs"
# smell.
#
# A working example lives in templates/examples/router-smoke.yaml (not copied
# by `lks init`).
#
# responses:
#   company_name:
#     intent: ask_company_name
#     instruction: Select this when the agent asks which company the caller represents.
#     text: It's Bluebird Property Management.
#   off_script:
#     intent: off_script
#     instruction: Select this only when the agent's question matches none of the
#       other responses.
#     text: I'm sorry, could we stay focused?
#     system: true          # REQUIRED — parse fails without it
