apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: outbound-callee-sim
  locale: en-US
  tags:
  - telephony
  - outbound
  - sim_callee
persona:
  name: Alex
  brief: You just answered a phone call. You are a real person, slightly busy. Be brief and natural.
  goals:
  - Understand why they called
  - End politely if not interested
  style: short, natural phone speech
execute:
  max_turns: 10
  timeout_s: 120
  first_speaker: user
caller:
  mode: outbound_sim_callee
telephony:
  call_to: '+15559876543'
assert:
  transcript:
  - role: agent
    contains_any:
    - a
    - e
    - i
    - o
    - u
  sip:
    participant_present: true
    call_status_any:
    - active
    dial_answered: true
pass_criteria:
  criteria:
  - The agent spoke to the callee
  - The conversation was understandable
