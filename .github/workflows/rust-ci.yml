name: Rust CI

# Rust full-port (src/livekit_agent_simulator_rust/) — offline gates only.
# P0/P1 run `cargo test -p lks-core` WITHOUT building libwebrtc — that is the whole
# point of the fine-grained workspace split (D1): `livekit` (C++ libwebrtc) only
# enters via lks-livekit from P2. Windows is `cargo check` only (research §1.6
# VERIFY: no Windows release promise in v1).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runs: "-p lks-core -p lks -p lks-mcp -p lks-livekit"
          - os: macos-latest
            runs: "-p lks-core -p lks -p lks-mcp -p lks-livekit"
          - os: windows-latest
            runs: "-p lks-core" # check only; the lks binary pulls libwebrtc via lks-livekit/lks-mcp (not supported on Windows)
    defaults:
      run:
        working-directory: src/livekit_agent_simulator_rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lks-web rust-embeds web/dist at compile time — build it first
      # (web/dist is gitignored; the Python CI builds it for the wheel).
      - name: Setup pnpm
        if: matrix.os != 'windows-latest'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: matrix.os != 'windows-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI (report player embed)
        if: matrix.os != 'windows-latest'
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web

      - name: Install libwebrtc system deps (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libssl-dev pkg-config

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/livekit_agent_simulator_rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/livekit_agent_simulator_rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        if: matrix.os != 'windows-latest'
        run: cargo fmt --check

      - name: Clippy (workspace)
        if: matrix.os != 'windows-latest'
        run: cargo clippy -- -D warnings

      - name: Build lksr binary (harness dependency)
        if: matrix.os != 'windows-latest'
        run: cargo build -p lks

      - name: Build + test (offline core)
        if: matrix.os != 'windows-latest'
        run: cargo test ${{ matrix.runs }}

      - name: Cargo check only (Windows — no libwebrtc build guarantee)
        if: matrix.os == 'windows-latest'
        run: cargo check ${{ matrix.runs }}
