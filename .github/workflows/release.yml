name: Release (Rust binary)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: lksr-macos-aarch64.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            asset: lksr-macos-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: lksr-linux-x86_64.tar.gz
    defaults:
      run:
        working-directory: src/livekit_agent_simulator_rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install libwebrtc deps (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libssl-dev pkg-config
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p lks
      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lksr dist/lksr
          tar -czf ${{ matrix.asset }} -C dist lksr
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: src/livekit_agent_simulator_rust/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          ls -la
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
