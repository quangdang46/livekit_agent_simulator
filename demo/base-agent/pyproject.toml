[project]
name = "base-agent-demo"
version = "0.1.0"
description = "General-purpose LiveKit voice agent demo — multi-agent handoff, tools, tasks — a flexible target for lks black-box testing beyond DTMF."
requires-python = ">=3.12"
dependencies = [
    "livekit-agents>=1.2",
    "livekit-plugins-openai>=0.11",
    "livekit-plugins-google>=1.2",
    "livekit-plugins-deepgram>=0.8",
    "livekit-plugins-cartesia>=0.6",
    "python-dotenv>=1.0",
]

[project.scripts]
base-agent = "base_agent.agent:main"

[tool.uv]
package = false

[tool.setuptools]
py-modules = []
