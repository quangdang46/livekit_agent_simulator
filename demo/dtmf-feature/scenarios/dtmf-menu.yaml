apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: dtmf-menu
  locale: en-US
  tags: [dtmf, ivr, draft]

persona:
  name: Alex
  brief: |
    You are calling a business. An automated assistant reads a keypad menu.
    Press the keys it asks for on your telephone keypad, and answer questions
    with one or two words only.
  goals:
  - Press 1 and 2 when the menu is read
  - End the call politely after both presses
  style: polite, brief

execute:
  max_turns: 8
  timeout_s: 120
  first_speaker: agent

script:
  steps:
    # Press 1 shortly after the agent starts talking (greeting/menu).
    - id: press-1
      action: dtmf
      trigger: agent_speaking
      delay_ms: 700
      digits: "1"
    # Say what you pressed so the agent has a spoken signal too.
    - id: say-pressed-1
      action: speak
      trigger: time
      delay_ms: 4000
      say: "I pressed one."
      once: true
    # Press 2 after the agent responds to the first press.
    - id: press-2
      action: dtmf
      trigger: agent_speaking
      delay_ms: 2000
      digits: "2"
    # Say what you pressed so the agent has a spoken signal too.
    - id: say-pressed-2
      action: speak
      trigger: time
      delay_ms: 4000
      say: "I pressed two."
      once: true
    # Wrap up and end the call politely.
    - id: farewell
      action: speak
      trigger: time
      delay_ms: 6000
      say: "Great, that's all I needed. Thanks, goodbye."
      once: true
    - id: hangup
      action: hang_up
      trigger: time
      delay_ms: 9000

pass_criteria:
  criteria:
  - The agent heard and acknowledged the caller's keypad presses
  - The caller pressed the keys the agent asked for
