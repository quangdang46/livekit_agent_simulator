[package]
name = "lks-livekit"
description = "Media/network for livekit-agent-simulator: room, dispatch, observer, sim legs, callers, audio. Adds the livekit + gemini-live deps (P2+)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lks-core = { path = "../lks-core" }
agent-sim-proto = { path = "../agent-sim-proto" }
gemini-live = { path = "../gemini-live" }

livekit = { version = "0.8.3", features = ["rustls-tls-webpki-roots"] }
livekit-api = { version = "0.6.3", features = ["rustls-tls-webpki-roots"] }
livekit-protocol = "0.7.12"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
base64 = "0.23.1"
futures-util = "0.3.34"
hound = "3.5.1"
regex = "1.13.1"
rand = { workspace = true }
jiff = { workspace = true }
parking_lot = "0.12"

[features]
# Passthrough so `cargo build -p lks --features lks-core/python-plugins`
# (or lks-livekit/python-plugins) enables the embedded-CPython plugin bridge.
python-plugins = ["lks-core/python-plugins"]

[dev-dependencies]
tempfile = "3.20.0"
