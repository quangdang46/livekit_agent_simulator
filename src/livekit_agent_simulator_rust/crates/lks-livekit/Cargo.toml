[package]
name = "lks-livekit"
description = "Media/network for livekit-agent-simulator: room, dispatch, observer, sim legs, callers, audio. Adds the livekit + gemini-live deps (P2+)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lks-core = { path = "../lks-core" }
gemini-live = { path = "../gemini-live" }

livekit = { version = "0.8.3", features = ["rustls-tls-webpki-roots"] }
livekit-api = { version = "0.6.3", features = ["rustls-tls-webpki-roots"] }
livekit-protocol = "0.7.12"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
base64 = "0.23.1"
futures-util = "0.3.34"
hound = "3.5.1"
rand = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
tempfile = "3.20.0"
