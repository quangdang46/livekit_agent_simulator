[package]
name = "lks-mcp"
description = "MCP server for livekit-agent-simulator (rmcp, 21 tools). P5; stub at P0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lks-core = { path = "../lks-core" }
lks-livekit = { path = "../lks-livekit" }

rmcp = { version = "3.1.2", features = ["server", "client", "macros", "schemars", "transport-io", "transport-async-rw", "transport-child-process"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "io-std", "sync", "io-util"] }
anyhow = { workspace = true }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
schemars = "1.0.0"

[dev-dependencies]
tempfile = "3.20.0"
