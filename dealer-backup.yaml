apiVersion: agent-sim/v1
kind: Scenario
metadata:
  id: dealer-live-full
  locale: en-US
  tags:
  - smoke
  - regression
persona:
  name: Alex
  brief: >
    Polite buyer calling Vehicle Wholesales (Jade) about a used Toyota Hilux.
    Follows the dealership call flow: availability → alternatives → price
    negotiation → test-drive booking → goodbye. Never invents card numbers.
  goals:
  - Ask whether a used Toyota Hilux is still available
  - Ask about similar pickups if Hilux is out of stock
  - Negotiate price flexibility
  - Book a test drive for tomorrow morning
  - Say goodbye politely
  style: polite, brief, 1-2 sentence turns
execute:
  max_turns: 12
  timeout_s: 300
  # Dealer seed uses start_speaker=user (USER_FIRST) — the caller must speak
  # first, otherwise both sides wait forever (first_speaker=agent deadlocks).
  first_speaker: user
# Full-feature contract path — exercises the real lks caller_contract stack:
# ContractCallerDriver + OpenAI text backend + Tier-1 rule-based validator.
#
# LKS PRIMITIVE COVERAGE (each step = one feature; verified live runs 004+):
#  caller_steps kinds (DSL line 77: say/do/wait/dtmf/interrupt/play_audio/
#  end/silence/hangup — all 9 exercised here):
#   - play_audio: (ambient bed, parallel noise layer — never TTS/validator)
#   - say: (verbatim; bypasses AI+validator but crosses the turn gate)
#   - wait: 1200ms (blind ms sleep → contract.wait event; proves the driver
#     honors wall-clock holds between turns — distinct from trigger:silence
#     which waits for the AGENT; both primitives covered side by side)
#   - do: negotiate + target: price — DOCUMENTED, NOT LIVE (see Turn 3
#     NOTE: fails closed on validation AND can never satisfy live; covered
#     by lks unit tests instead). The seeded interruption policy primitive
#     (interaction:) is covered on do: arrange_visit instead.
#   - say: + trigger agent_speaking + barge_in: true (contract.barge class:
#     correction; recovery tracking)
#   - interrupt: + interaction.interrupt_class: backchannel (fixed-line
#     cut-in, NOT validator-gated)
#   - dtmf: "1" (IVR keypress → contract.control event; proves control-action
#     path fires mid-voice-flow without breaking turn-taking)
#   - do: arrange_visit (lexicon fixed in lks 7e0fc48: "test drive" pattern;
#     generator's natural booking phrasing now validates)
#   - silence: hold-the-line pause (contract.control; proves the caller can
#     yield a beat for the agent to finish without speaking)
#   - do: end (lexicon fixed in lks 7e0fc48: thank-you closings; generator's
#     natural goodbye now validates; goodbye-guard allows bye phrases ONLY
#     for end behaviors — validator step 6)
#   - hangup: true (run terminator → contract.end → DriverResult SCENARIO;
#     proves the hangup spelling alongside `end: true` coverage below —
#     only ONE terminator fires per run, see Turn 8 NOTE)
#  triggers (trigger: sibling on say:/play_audio:):
#   - kind: time (play_audio bed starts 1500ms in)
#   - kind: silence (say fires after agent silent delay_ms — the
#     wait-for-agent-turn primitive; DSL `wait:` is ms-only)
#   - kind: agent_speaking (say fires once agent spoke continuously
#     min_agent_active_ms, then delay_ms)
#  interaction: (delivery shaping / seeded interruption policy):
#   - interruption_rate/interval_ms/seed on do: arrange_visit
#     (deterministic backchannel cut-in, scenario-seeded — never an LLM
#     decision)
#   - interrupt_class: backchannel on interrupt:
#   - pre_delay: 800 on do: arrange_visit (delivery shaping: pause
#     before the booking turn speaks — proves pre-delay honored on do:)
#  constraints: (orthogonal budget/guard knobs, one per do:):
#   - do: arrange_visit → max_turns: 5 + max_duration_s: 120 (satisfaction
#     budget widened — run 014: agent needs several turns; budget burn on
#     a VALID utterance is a budget bug, not a behavior bug)
#   - do: end → max_turns: 5 + max_words: 20 + must_not: [end_call]
#     (must_not spells the goodbye-guard explicitly even though end IS the
#     end behavior — proves must_not parsing accepts the value; the guard
#     only fires when the contract is NOT an end behavior)
#   - forbidden_intents: [upsell] on do: arrange_visit (lexical baseline
#     runs every validation; proves the knob parses + enforces)
#  assert: (deterministic checks, no LLM):
#   - tools: check_inventory min_count 1 + args_contains {make: Toyota}
#     (proves backend delegation; lks fix b3c0509 parses the JSON-string
#     arguments the agent-session observer emits)
#   - transcript: agent contains_any + must_not_match (stock-invention guard)
#   - outcomes: transcript_contains ×2 (incl. negate: true) + ended_by:
#     sim (proves the SIM hung up first via hangup: — the run-terminator
#     assertion the lksr validator warned was missing) + recovery
#     (barge_recovery_rate ≥ path — proves the Turn 4 barge recovered)
#     + latency (turn-taking p95 gate — proves responsiveness budget)
#
# DELIBERATELY NOT USED (documented, not forgotten):
# - `do:` with a pinned target OUTSIDE the Tier-1 TARGET_KEYWORDS lexicon
#   (price/delivery_date/order_status/hours/plan/status/charge/fees) — any
#   other pinned target fails closed as TARGET_UNVERIFIED by design (run
#   024). Availability/booking topics ride on verbatim say: lines +
#   conversation context instead.
# - `interaction` pace/hesitation/stumble/backchannel/barge_in (TTS delivery
#   shaping; say: delivery is byte-faithful by design — driver keeps say PCM
#   exact for strict transcript-match — so shaping knobs stay on do: timing
#   only: interruption_policy + pre_delay. Covered by lks unit tests).
# - outcomes llm_bool/goals_met/constraint_respected: LLM-judge-gated
#   (need judge backend; deterministic transcript_contains + ended_by +
#   recovery + latency already prove the run without one).
#
# KNOWN LIMITATION — Gemini provider flake-rate (accepted, 2026-09-17):
# OpenAI is the stable primary provider (multiple clean passes). Gemini
# runs mechanism-complete (TTS/trigger/provider-branch/publish all fire —
# proven runs 031/035/041/043/045/047/049) but its do: generator sampling
# distribution drifts off the Tier-1 lexicon far more often on
# arrange_visit: question-shape ("Would/How does X work/sound?" — "how
# does" is a literal ask-pattern), self-intro ("Sure, it's Alex..."),
# time-phrase ("Around 10:00 AM would work best"). 0/6 clean passes over
# 3 hunt rounds (runs 042-049) vs OpenAI's regular passes. DELIBERATE:
# lexicon NOT widened (would break ask/arrange_visit separation for both
# providers). Best gemini evidence: run 041 lksr (zero violation/error,
# arrange_visit + do:end VALID, agent "pencil you in" matched).
caller_steps:
  # Ambient office bed under the whole call (parallel noise layer).
  - play_audio:
      asset: builtin:noise.ambient
      gain: 0.3
      loop: true
    trigger:
      kind: time
      delay_ms: 1500
  # Turn 1 — availability, verbatim (dealer-specific wording the generator
  # cannot be steered to: live wiring passes no relevant_facts/persona into
  # the text backend — BehaviorContract only — so target-free do: only works
  # mid-conversation, never for the opening domain-specific line).
  - say: "Hi, I'm looking for a used Toyota Hilux. Is it still available?"
  # Turn 2 — alternatives, gated on agent silence (agent finished answering).
  # NOTE (run 004): `do: negotiate` does NOT belong here — the caller's own
  # prior turn already asked the price, so the generator paraphrases into an
  # ask-shaped "What is the asking price?" (ask outscores negotiate on act
  # counts → SEMANTIC_ACT_MISMATCH ×3). Negotiation validates only when the
  # agent has already stated a price to negotiate DOWN from.
  - say: "Do you have anything similar in stock, like another pickup?"
    trigger:
      kind: silence
      delay_ms: 3000
  # Turn 3 — price flexibility, verbatim + wall-clock hold BEFORE it.
  # `wait: 1200` proves `wait:` (blind ms sleep → contract.wait event) is
  # distinct from trigger:silence (wait-for-agent-turn) — both primitives
  # covered side by side. 1200ms keeps the rhythm natural.
  # NOTE (runs 004/012/013 + lks-fullfeat-v3 run 022): NO negotiate-do:
  # survives this slot, for TWO independent reasons:
  # - VALIDATION: `do: negotiate` + target price → generator asks "What
  #   is/best the asking price?" (ask-shaped; no price stated yet to
  #   concede from) → SEMANTIC_ACT_MISMATCH/LOW_CONFIDENCE ×3.
  # - SATISFACTION (run 022, the deeper lesson): even a VALID negotiate
  #   turn ("…closer to my budget of $35,000") can NEVER satisfy — the
  #   evaluator's negotiate arm needs a reasoned REFUSAL ("can't go lower",
  #   "best price", "price is firm"…), but the agent truthfully answers
  #   the price is ALREADY UNDER budget, so no refusal ever comes →
  #   FAILED_MAX_TURNS. A do: whose satisfaction condition the agent can
  #   NEVER meet (truthfully) is a scenario bug, not an agent bug.
  # Verbatim say keeps the turn deterministic; the negotiate behavior
  # (with pinned target + max_budget + forbidden_intents) is covered by
  # lks unit tests (test_contract_validator), not live.
  - wait: 1200
  - say: "Is there any wiggle room on the price?"
  # Turn 5 — barge-in: caller cuts in while the agent is mid-answer about
  # price, pushing to book. Exercises the interruption path (contract.barge,
  # class correction, barge_recovery_rate).
  - say: "Sorry to cut in — can I book a test drive tomorrow morning?"
    trigger:
      kind: agent_speaking
      min_agent_active_ms: 1500
      delay_ms: 500
    barge_in: true
  # Turn 6 — short backchannel cut-in (fixed line, not validator-gated).
  - interrupt: true
    interaction:
      interrupt_class: backchannel
  # Turn 6a — IVR keypress: proves `dtmf:` (contract.control event) fires
  # mid-voice-flow without breaking turn-taking. "1" = "yes, book it".
  - dtmf: "1"
  # Turn 7 — booking via contract behavior. Generator phrases "schedule a
  # test drive" — Tier-1 now covers it (lks 7e0fc48 "test drive" pattern;
  # golden case act-arrange-visit-test-drive-pass). Pre-fix this slot failed
  # BEHAVIOR_TIMEOUT ×3 (runs 005-006). interaction: carries the seeded
  # interruption policy (moved from Turn 3 — the primitive is covered on a
  # behavior that CAN satisfy here) + pre_delay: 800 (delivery shaping:
  # pause before the booking turn speaks).
  # constraints.max_turns: 5 widens the satisfaction budget (default 3):
  # the agent legitimately needs several turns here (check stock → report
  # no utes → offer callback), and run 014 showed the caller re-asking
  # while the agent was still working. The `constraints:` primitive
  # (max_turns/max_duration_s) is covered here instead of a bare default.
  - do:
      behavior: arrange_visit
      constraints:
        max_turns: 5
        max_duration_s: 120
        forbidden_intents: [upsell]
      interaction:
        interruption_rate: low
        interruption_interval_ms: 20000
        interruption_seed: 7
        pre_delay: 800
  # Turn 7a — hold-the-line pause: proves `silence:` (contract.control)
  # yields a beat for the agent to finish without the caller speaking.
  - silence: true
  # Turn 8 — goodbye via end behavior. Generator phrases "Thank you for your
  # help!" — Tier-1 now covers it (lks 7e0fc48 thank-you closings; golden
  # case act-end-thanks-pass). Pre-fix this slot failed LOW_CONFIDENCE ×3
  # (run 007). Goodbye-guard allows bye phrases only for end behaviors.
  # constraints.max_turns: 5 (same rationale as Turn 7 — run 014: the agent
  # says "you're welcome / happy to help" without a time/booking hook, so
  # the evaluator holds out while the caller burns its 3-turn default;
  # FAILED_MAX_TURNS on a VALID utterance is a budget bug, not a behavior
  # bug). max_words: 20 keeps the close short. must_not: [end_call] spells
  # the goodbye-guard explicitly (guard only fires on NON-end contracts,
  # so this parses + passes — proving the knob).
  - do:
      behavior: end
      constraints:
        max_turns: 5
        max_words: 20
        must_not: [end_call]
  # Turn 8 terminator — hangup: spelling (contract.end → DriverResult
  # SCENARIO). NOTE: only ONE terminator fires per run; `end: true` is the
  # documented alternate spelling (driver treats both identically) — this
  # file covers hangup: live, end: stays covered by unit tests + docs.
  - hangup: true
plugins: [db_call_tracking] 

assert:
  tools:
  - name: check_inventory
    min_count: 1
    args_contains:
      make: Toyota
  transcript:
  - role: agent
    contains_any:
    - Hilux
    - stock
    - available
    must_not_match: "I don't know"
  outcomes:
  - id: stock_answered
    type: transcript_contains
    phrases:
    - Hilux
    - available
    - sold
    - stock
  - id: no_invented_stock
    type: transcript_contains
    phrases:
    - "I don't know"
    negate: true
  - id: sim_hung_up_first
    type: ended_by
    ended_by: sim
  - id: barge_recovered
    type: recovery
    min_barge_recovery_rate: 0.5
  - id: responsive_turns
    type: latency
    max_turn_p95_ms: 15000
pass_criteria:
  criteria:
  - The agent answered about vehicle availability
  - The agent stayed on-topic without inventing stock details
  - The agent called check_inventory for the Hilux query
